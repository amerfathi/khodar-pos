name: Production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver matching package.json (for example 2.6.4)
        required: true
        type: string
      publish:
        description: Publish GitHub assets and D1 update metadata after both signed builds pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - name: Verify requested version
        run: node -e "if(require('./package.json').version!==process.env.VERSION)process.exit(1)"
        env: { VERSION: "${{ inputs.version }}" }
      - run: npm run build && npx cap sync android
      - name: Restore Android signing identity
        shell: bash
        env:
          KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          STORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/android/release.keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
      - name: Build signed direct-distribution APK
        working-directory: android
        run: bash ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk Brraka-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-release, path: Brraka-Android.apk, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Verify requested version
        shell: pwsh
        run: if ((Get-Content package.json | ConvertFrom-Json).version -ne '${{ inputs.version }}') { exit 1 }
      - name: Restore encrypted updater signing key
        shell: pwsh
        env:
          PRIVATE_KEY: "${{ secrets.BRRAKA_RELEASE_PRIVATE_KEY_PEM }}"
        run: |
          if (-not $env:PRIVATE_KEY) { throw 'Updater signing key is missing' }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'release-private-key.pem'), $env:PRIVATE_KEY)
      - name: Build Windows installer
        run: npm run electron:build
      - name: Sign update manifest
        shell: pwsh
        env:
          BRRAKA_RELEASE_PRIVATE_KEY_FILE: "${{ runner.temp }}\release-private-key.pem"
          BRRAKA_RELEASE_PRIVATE_KEY_PASSPHRASE: "${{ secrets.BRRAKA_RELEASE_PRIVATE_KEY_PASSPHRASE }}"
        run: npm run release:sign-windows -- '${{ inputs.version }}' 'dist-electron\KhodarPOS-Setup.exe' 'windows-manifest.json'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist-electron/KhodarPOS-Setup.exe
            windows-manifest.json
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: android-release, path: release }
      - uses: actions/download-artifact@v4
        with: { name: windows-release, path: release }
      - name: Publish immutable GitHub release assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v${{ inputs.version }}" release/Brraka-Android.apk release/KhodarPOS-Setup.exe release/windows-manifest.json --title "BRAKA v${{ inputs.version }}" --generate-notes --target "$GITHUB_SHA"
      - name: Publish signed release metadata to D1
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          CLOUDFLARE_D1_DATABASE_ID: bf2fbfa3-eb13-4687-ac97-b17740c300de
        run: |
          node scripts/publish-release-d1.cjs android '${{ inputs.version }}' release/Brraka-Android.apk
          node scripts/publish-release-d1.cjs windows '${{ inputs.version }}' release/KhodarPOS-Setup.exe release/windows-manifest.json
